			function leerCookie()
			{
				var buscamos = "urlpasarela=";
				i = document.cookie.indexOf(buscamos);

				if (document.cookie.length > 0)
				{
					i = document.cookie.indexOf(buscamos);
					if (i != -1)
					{
						i += buscamos.length;
						j = document.cookie.indexOf(";", i);
						if (j == -1)
						{
							j = document.cookie.length;
						}
						return document.cookie.substring(i, j);
					}
				} else {
					return "";
				}
			}

			function getURLParameter(parametro)
			{
				var Url = leerCookie();
				var aux = "";
				Variables = Url.split ("&");
				for (i = 0; i < Variables.length; i++) {
					   Separ = Variables[i].split("=");
					   if(parametro == Separ[0]){
							aux = Separ[1];
							break;
					   }		   
				}
				return aux;
			}

			function isEstandar()
			{
				var Url = leerCookie();
				if(Url.indexOf("proceso=tlpa_pago_transfer_pr") != -1)
					return true;
				else
					return false;	
			}

			function isVisible()
			{
				if(isEstandar()){
					urlSalida = getURLParameter('UrlSalida');	
					if(!urlSalida) {
						document.getElementById("bSalir").style.visibility="hidden";
					}
				}	
			}

			function fSalir()
			{
				var framePE = (getURLParameter("framePE") === 'true');	
				if(isEstandar()) {
					//Cambio ANS
					urlSalida = DOMPurify.sanitize(decodeURIComponent(getURLParameter("UrlSalida"))); //Decodificamos la URI
					if(framePE)
						window.location.href = urlSalida;
					else
						top.location.href = urlSalida;
				} else {
					window.top.history.go(-2);
				}	
			}

			function redirigir(f,nombre)
			{
				var urlOrigen = leerCookie();
				
				if (urlOrigen == undefined || urlOrigen.length == 0)
				{
					alert("Debe activar las Cookies en su navegador.");
				}
				else
				{
					dominioAux = urlOrigen.substring (urlOrigen.indexOf('\/\/')+2);

					dominioOri = dominioAux.substring (0,dominioAux.indexOf('\/'));

					cambioWebSeal(dominioOri);

					if (nombre != 'cash')
					{
						urlAux = urlOrigen.substring (0,urlOrigen.indexOf('\/\/')+2);
						if (nombre == 'net') 
						{
							urlAux+= WebS_net;
							//urlAux+= dominioAux.substring (dominioAux.indexOf('\/'), dominioAux.indexOf('LogonOperacionServlet'))
							urlAux+= dominioAux.substring (dominioAux.indexOf('\/'));
							//urlAux+= "DFactor";
							//urlAux+= dominioAux.substring (dominioAux.indexOf('?'));		
						}
						
						if (nombre == 'office')
						{
							urlAux+= WebS_office;
							urlAux+= dominioAux.substring (dominioAux.indexOf('\/'));
						}
						
						//urlAux+= dominioAux.substring (dominioAux.indexOf('\/'));							
					}
					else
					{
						if (nombre == 'cash')
						{
							dominioDes = WebS_cash;
						}
						else
						{
							dominioDes = ip;			
						}
						
						urlAux = urlOrigen.substring (0,urlOrigen.indexOf('\/\/')+2);
						urlAux+= dominioDes;
						urlAux+= dominioAux.substring (dominioAux.indexOf('\/'));			
					}
				}
				f.action = urlAux;
				f.submit();
			}
